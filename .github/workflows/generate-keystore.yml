name: Generate Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore uh-debug.jks \
            -storepass uhdebug123 \
            -keypass uhdebug123 \
            -alias uhdebug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=UH Companion, OU=Dev, O=UH, L=City, ST=State, C=IN"

      - name: Print base64 to log
        run: |
          echo "=========== COPY EVERYTHING BELOW THIS LINE ==========="
          base64 -w0 uh-debug.jks
          echo ""
          echo "=========== COPY EVERYTHING ABOVE THIS LINE ==========="

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: uh-debug-keystore
          path: uh-debug.jks
