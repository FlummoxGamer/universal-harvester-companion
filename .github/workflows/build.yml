name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APKs
        working-directory: src
        run: gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Read version
        id: ver
        working-directory: src
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo "version missing"
            exit 1
          fi
          echo "code=$VC" >> $GITHUB_OUTPUT
          echo "name=$VN" >> $GITHUB_OUTPUT
          echo "Building v$VN (code $VC)"

      - name: Locate APKs
        id: apks
        working-directory: src
        run: |
          ls -la app/build/outputs/apk/debug/
          ARM64=$(find app/build/outputs/apk/debug -name "*-arm64-v8a-debug.apk" | head -1)
          ARM32=$(find app/build/outputs/apk/debug -name "*-armeabi-v7a-debug.apk" | head -1)
          if [ -z "$ARM64" ] || [ -z "$ARM32" ]; then
            echo "Missing split APK(s). Found:"
            find app/build/outputs/apk/debug -name "*.apk"
            exit 1
          fi
          echo "arm64=$ARM64" >> $GITHUB_OUTPUT
          echo "arm32=$ARM32" >> $GITHUB_OUTPUT
          echo "ARM64 APK: $ARM64"
          echo "ARM32 APK: $ARM32"

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp "src/${{ steps.apks.outputs.arm64 }}" "out/uh-companion-${{ steps.ver.outputs.name }}-arm64-v8a.apk"
          cp "src/${{ steps.apks.outputs.arm32 }}" "out/uh-companion-${{ steps.ver.outputs.name }}-armeabi-v7a.apk"
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uh-companion-debug
          path: out/*.apk
          if-no-files-found: error

      - name: Publish to builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          VN="${{ steps.ver.outputs.name }}"
          ARM64="uh-companion-$VN-arm64-v8a.apk"
          ARM32="uh-companion-$VN-armeabi-v7a.apk"
          mkdir -p /tmp/publish
          cp "out/$ARM64" /tmp/publish/
          cp "out/$ARM32" /tmp/publish/
          cat > /tmp/publish/version.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "$VN",
            "apkUrlArm64": "https://raw.githubusercontent.com/$REPO/builds/$ARM64",
            "apkUrlArm32": "https://raw.githubusercontent.com/$REPO/builds/$ARM32",
            "apkUrl": "https://raw.githubusercontent.com/$REPO/builds/$ARM64",
            "changelog": "",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cd /tmp/publish
          git init -q -b builds
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build v$VN (${{ steps.ver.outputs.code }})"
          git push origin builds --force
