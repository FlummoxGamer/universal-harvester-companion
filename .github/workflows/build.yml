name: Build

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode keystore
        working-directory: src
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > uh-debug.jks
          ls -la uh-debug.jks

      - name: Build debug APKs
        working-directory: src
        run: gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Read version & set branch targets
        id: ver
        working-directory: src
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo "version missing"
            exit 1
          fi
          
          if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            VN="${VN}-dev"
            TARGET_BRANCH="builds-dev"
            VERSION_FILE="version-dev.json"
          else
            TARGET_BRANCH="builds"
            VERSION_FILE="version.json"
          fi
          
          echo "code=$VC" >> $GITHUB_OUTPUT
          echo "name=$VN" >> $GITHUB_OUTPUT
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
          echo "version_file=$VERSION_FILE" >> $GITHUB_OUTPUT
          echo "Building v$VN (code $VC) for $TARGET_BRANCH"

      - name: Locate APKs
        id: apks
        working-directory: src
        run: |
          ls -la app/build/outputs/apk/debug/ || true
          ARM64=$(find app/build/outputs/apk/debug -name "*-arm64-v8a-debug.apk" | head -1)
          ARM32=$(find app/build/outputs/apk/debug -name "*-armeabi-v7a-debug.apk" | head -1)
          if [ -z "$ARM64" ]; then
            echo "Missing arm64 APK"
            find app/build/outputs/apk/debug -name "*.apk"
            exit 1
          fi
          echo "arm64=$ARM64" >> $GITHUB_OUTPUT
          echo "arm32=$ARM32" >> $GITHUB_OUTPUT
          echo "ARM64: $ARM64"
          echo "ARM32: $ARM32"

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp "src/${{ steps.apks.outputs.arm64 }}" "out/uh-companion-${{ steps.ver.outputs.name }}-arm64-v8a.apk"
          if [ -n "${{ steps.apks.outputs.arm32 }}" ]; then
            cp "src/${{ steps.apks.outputs.arm32 }}" "out/uh-companion-${{ steps.ver.outputs.name }}-armeabi-v7a.apk"
          fi
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uh-companion-debug
          path: out/*.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          VN="${{ steps.ver.outputs.name }}"
          VC="${{ steps.ver.outputs.code }}"
          TAG="v$VN-$VC"
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Build $VN ($VC)" \
            --notes "Automated build (${{ github.ref_name }})" \
            out/*.apk

      - name: Publish version JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          VN="${{ steps.ver.outputs.name }}"
          VC="${{ steps.ver.outputs.code }}"
          TAG="v$VN-$VC"
          TARGET_BRANCH="${{ steps.ver.outputs.target_branch }}"
          VERSION_FILE="${{ steps.ver.outputs.version_file }}"
          
          ARM64="uh-companion-$VN-arm64-v8a.apk"
          ARM32="uh-companion-$VN-armeabi-v7a.apk"
          mkdir -p /tmp/publish

          ARM32_LINE=""
          if [ -f "out/$ARM32" ]; then
            ARM32_LINE="\"apkUrlArm32\": \"https://gh-proxy.com/https://github.com/$REPO/releases/download/$TAG/$ARM32\","
          fi

          cat > /tmp/publish/$VERSION_FILE <<EOF
          {
            "versionCode": $VC,
            "versionName": "$VN",
            "apkUrlArm64": "https://gh-proxy.com/https://github.com/$REPO/releases/download/$TAG/$ARM64",
            $ARM32_LINE
            "apkUrl": "https://gh-proxy.com/https://github.com/$REPO/releases/download/$TAG/$ARM64",
            "changelog": "",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          
          cat /tmp/publish/$VERSION_FILE
          cd /tmp/publish
          git init -q -b $TARGET_BRANCH
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build $VN ($VC)"
          git push origin $TARGET_BRANCH --force
