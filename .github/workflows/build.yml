name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Read version
        id: ver
        working-directory: src
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo "version missing"
            exit 1
          fi
          echo "code=$VC" >> $GITHUB_OUTPUT
          echo "name=$VN" >> $GITHUB_OUTPUT
          echo "Building v$VN (code $VC)"

      - uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
        continue-on-error: true

      - name: Prepare builds branch
        run: |
          mkdir -p builds
          cd builds
          git init -q 2>/dev/null || true
          if [ ! -d .git ]; then
            git init -q
          fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin builds -q || true
          git checkout -B builds origin/builds 2>/dev/null || git checkout -B builds
          rm -f *.apk
          cp ../src/app/build/outputs/apk/debug/app-debug.apk "uh-companion-${{ steps.ver.outputs.name }}.apk"

      - name: Write version.json
        run: |
          cd builds
          REPO="${{ github.repository }}"
          APK="uh-companion-${{ steps.ver.outputs.name }}.apk"
          cat > version.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "${{ steps.ver.outputs.name }}",
            "apkUrl": "https://raw.githubusercontent.com/$REPO/builds/$APK",
            "changelog": "",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat version.json

      - name: Push builds branch
        working-directory: builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})" || echo "no changes"
          git push origin builds --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uh-companion-debug
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
