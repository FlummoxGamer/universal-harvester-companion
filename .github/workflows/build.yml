name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Read version
        id: ver
        working-directory: src
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo "version missing"
            exit 1
          fi
          echo "code=$VC" >> $GITHUB_OUTPUT
          echo "name=$VN" >> $GITHUB_OUTPUT
          echo "Building v$VN (code $VC)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uh-companion-debug
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          APK="uh-companion-${{ steps.ver.outputs.name }}.apk"
          mkdir -p /tmp/publish
          cp src/app/build/outputs/apk/debug/app-debug.apk "/tmp/publish/$APK"
          cat > /tmp/publish/version.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "${{ steps.ver.outputs.name }}",
            "apkUrl": "https://raw.githubusercontent.com/$REPO/builds/$APK",
            "changelog": "",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cd /tmp/publish
          git init -q -b builds
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})"
          git push origin builds --force
